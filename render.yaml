services:
  - type: web
    name: trail-companion-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Neon pooled connection URL. Falls back to DATABASE_URL when unset.
      - key: DATABASE_URL_POOLED
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_KEY
        generateValue: true
      # Comma-separated. Static site URL, e.g. https://trail-companion-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
